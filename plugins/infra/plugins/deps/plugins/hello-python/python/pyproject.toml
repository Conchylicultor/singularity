# A tiny real uv project for infra/deps' python kind: one dependency (numpy),
# installed on first use by `./singularity deps install hello-python`, run with
# runPython. Exercised by the deps tests; deleted once the audio pipeline lands
# as the first real consumer.
[project]
name = "hello-python"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.uv]
# Not a package: its source runs from the checkout (PYTHONPATH), never
# installed into the shared env.
package = false
