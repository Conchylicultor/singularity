# External prerequisites (not managed by mise):
#   - claude CLI    (already installed at ~/.local/bin/claude)
#
# Postgres is NOT one: the app ships its own cluster, and the script that
# starts it creates the base `singularity` database inside it. See
# docs/setup.md.
#
# The `setup` task runs automatically after `mise install` and does one thing:
# trust every worktree's mise.toml, once, machine-global. It is idempotent.

[settings]
experimental = true  # required for the [hooks] block below

[tools]
# What we want, not what runs: every tool at its latest release. What actually
# runs is the exact version `mise.lock` records beside this file — mise reads it
# through its shims, per checkout, so a worktree can trial a new version while
# main keeps its own.
#
# Nothing here is pinned, on purpose. An exact pin (or a prefix like "1.24")
# stops upgrades silently: Bun sat on 1.3.13 from May to September 2026 while
# fixed releases shipped. A minimum version, or a release to skip, is data with
# a reason in plugins/toolchain/core (`floor` / `holds`), enforced by the
# `toolchain:resolved` check. `./singularity toolchain upgrade` is the only
# thing that moves `mise.lock`; a daily job files the task that runs it.
bun = "latest"
go = "latest"
tmux = "latest"
rust = "latest"  # cargo + rustc for the Tauri desktop release shell (tauri/); end users need none of this

[tasks.setup]
description = "Trust every worktree's mise.toml (idempotent)"
run = '''
# Trust every current & future worktree's mise.toml in one shot. Each `git
# worktree add` inherits this committed config at a fresh, untrusted path, so
# shim invocations (bun/go/tmux) inside .claude/worktrees/<wt> otherwise emit
# "config not trusted" errors — including from Claude Code's PreToolUse Bash
# hook. Registering the directory is path-glob based, so it covers worktrees
# created by the server, by config-staging, AND by the Claude Code harness
# alike. `settings add` dedupes, so re-running setup is a no-op.
# Derive the MAIN checkout from git (worktrees live at <main>/.claude/worktrees)
# so this is correct whether setup runs from the main clone or from a worktree.
main_root="$(cd "$(dirname "$(git rev-parse --git-common-dir)")" && pwd)"
mise settings add trusted_config_paths "$main_root/.claude/worktrees"
'''

[hooks]
postinstall = "mise run setup"
