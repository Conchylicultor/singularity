<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Control panel vocabulary</title>
<meta name="description" content="One shared vocabulary behind every data-control panel: filter, sort and view settings rebuilt from the same rail, row, section and footer. Toggle the rail overlay to see the invariant." />
<meta name="prototype-viewport" content="1400x740" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ================================================================== *
 * icons
 * ================================================================== */

function Svg({ children, size = 16, w = 1.8 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
         strokeWidth={w} strokeLinecap="round" strokeLinejoin="round">{children}</svg>
  );
}

const ic = {
  filter:  <Svg><path d="M3 5.5h18M6.5 12h11M10 18.5h4" /></Svg>,
  sort:    <Svg><path d="M4 6.5h10M4 12h7M4 17.5h4M18 6.5v11M18 17.5l-3-3M18 17.5l3-3" /></Svg>,
  tune:    <Svg><path d="M5 21v-6M5 11V3M12 21v-9M12 8V3M19 21v-4M19 13V3M2.5 15h5M9.5 8h5M16.5 13h5" /></Svg>,
  check:   <Svg size={12} w={2.6}><path d="M20 6.5 9.5 17 4 11.5" /></Svg>,
  plus:    <Svg size={14}><path d="M12 5.5v13M5.5 12h13" /></Svg>,
  x:       <Svg size={13}><path d="M17.5 6.5 6.5 17.5M6.5 6.5l11 11" /></Svg>,
  chev:    <Svg size={12} w={2.2}><path d="M6 9.5 12 15l6-5.5" /></Svg>,
  search:  <Svg size={14}><circle cx="11" cy="11" r="6.2" /><path d="m20 20-3.6-3.6" /></Svg>,
  bookmark:<Svg size={15}><path d="M18 20.5 12 16l-6 4.5V5.5A1.5 1.5 0 0 1 7.5 4h9A1.5 1.5 0 0 1 18 5.5z" /></Svg>,
  trash:   <Svg size={15}><path d="M4 6.5h16M9.5 6.5V4.5h5v2M6.5 6.5 7.5 20h9l1-13.5" /></Svg>,
  eye:     <Svg size={15}><path d="M2 12s3.9-7 10-7 10 7 10 7-3.9 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="2.7" /></Svg>,
  grip:    <Svg size={14} w={0}><g fill="currentColor"><circle cx="9.5" cy="6" r="1.35"/><circle cx="9.5" cy="12" r="1.35"/><circle cx="9.5" cy="18" r="1.35"/><circle cx="15" cy="6" r="1.35"/><circle cx="15" cy="12" r="1.35"/><circle cx="15" cy="18" r="1.35"/></g></Svg>,
  text:    <Svg size={14}><path d="M5 6.5h14M12 6.5v11" /></Svg>,
  date:    <Svg size={14}><rect x="3.5" y="5.5" width="17" height="14.5" rx="2.5" /><path d="M3.5 10.5h17M8.5 3v4.5M15.5 3v4.5" /></Svg>,
  status:  <Svg size={14}><circle cx="12" cy="12" r="8" /><path d="m8.7 12.2 2.2 2.2 4.4-4.4" /></Svg>,
  tag:     <Svg size={14}><path d="M11.2 3.5H4v7.2l9.3 9.3 7.2-7.2z" /><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none" /></Svg>,
  number:  <Svg size={14}><path d="M9 4 7 20M17 4l-2 16M4.5 9h15M3.5 15h15" /></Svg>,
  list:    <Svg size={14}><path d="M4 6.5h16M4 12h16M4 17.5h10" /></Svg>,
  down:    <Svg size={13}><path d="M12 4.5v15M18 13.5l-6 6-6-6" /></Svg>,
  up:      <Svg size={13}><path d="M12 19.5v-15M6 10.5l6-6 6 6" /></Svg>,
};

/* ================================================================== *
 * THE VOCABULARY
 *
 * Everything below is the proposed primitive. Note what a caller can
 * NOT do: place a separator, choose a width, choose a row height, or
 * invent a selection indicator. That is the point — consistency is a
 * property of the primitive, not of the author's discipline.
 * ================================================================== */

function ControlPanel({ size = "menu", focused, rails, children }) {
  return (
    <div className="cp" data-size={size} data-focused={focused ? "true" : "false"}>
      {children}
      {rails ? <div className="rails"><i /><i /></div> : null}
    </div>
  );
}

/* A section. The CONTAINER draws the hairline between siblings, so an
   author never places one and the rhythm cannot drift. */
ControlPanel.Section = function Section({ label, children }) {
  return (
    <div className="cp-section">
      {label ? <div className="cp-section-label">{label}</div> : null}
      {children}
    </div>
  );
};

/* THE row. `select` picks the indicator, so "blue checkbox here, filled
   row there" is unrepresentable. */
ControlPanel.Row = function Row({
  icon, select = "none", checked, handle, trailing, tone, muted, onSelect, children,
}) {
  const leading =
    select === "check" ? <span className="sel-check" data-on={!!checked}>{ic.check}</span> :
    select === "radio" ? <span className="sel-mark" data-on={!!checked}>{ic.check}</span> :
    icon || null;
  const trail =
    select === "switch"
      ? <span className="sel-switch" data-on={!!checked}><span /></span>
      : trailing;
  return (
    <button className="cp-row" type="button"
            data-tone={tone} data-muted={muted ? "true" : "false"}
            data-selected={checked ? "true" : "false"} onClick={onSelect}>
      <span className="cp-row-gutter">{handle ? ic.grip : null}</span>
      <span className="cp-row-icon">{leading}</span>
      <span className="cp-row-label">{children}</span>
      <span className="cp-row-trailing">{trail}</span>
    </button>
  );
};

ControlPanel.RuleList = function RuleList({ children }) {
  return <div className="cp-rulelist">{children}</div>;
};

/* Named slots on ONE shared grid — so field / operator / value line up
   down the list, and the filter and sort builders line up with each
   other. Omitting `operator` lets `field` span its track. */
ControlPanel.RuleRow = function RuleRow({ prefix, handle, field, operator, value, onRemove }) {
  return (
    <div className="cp-rule" data-span={operator ? undefined : "field"}>
      <span className="cp-row-gutter">{handle ? ic.grip : null}</span>
      <span className="cp-rule-prefix">{prefix}</span>
      <span className="rc-field">{field}</span>
      <span className="rc-op">{operator}</span>
      <span className="rc-value">{value}</span>
      <button className="cp-rule-remove" type="button" onClick={onRemove}>{ic.x}</button>
    </div>
  );
};

/* Footer actions are rows on the same rails — never ghost buttons pinned
   to opposite corners. */
ControlPanel.Footer = function Footer({ children }) {
  return <div className="cp-footer">{children}</div>;
};

ControlPanel.Empty = function Empty({ children }) {
  return <div className="cp-empty">{children}</div>;
};

/* The one control shape inside a rule row, and its picker — itself built
   from Section + Row, so the language composes into its own sub-panels. */
function FieldControl({ icon, label, dim, onClick }) {
  return (
    <button className="cp-field" type="button" data-empty={dim ? "true" : "false"} onClick={onClick}>
      {icon ? <span style={{ display: "flex", color: "var(--fg-dim)" }}>{icon}</span> : null}
      <span className="cp-field-label">{label}</span>
      <span className="chev">{ic.chev}</span>
    </button>
  );
}

function Picker({ value, options, onChange, multi }) {
  const [open, setOpen] = useState(false);
  const box = useRef(null);
  useEffect(() => {
    if (!open) return;
    const away = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    window.addEventListener("mousedown", away);
    return () => window.removeEventListener("mousedown", away);
  }, [open]);

  const selected = multi ? options.filter((o) => value.includes(o.id)) : options.filter((o) => o.id === value);
  const label = multi
    ? (selected.length === 0 ? "Select…" : selected.length === 1 ? selected[0].label : selected.length + " selected")
    : (selected[0] ? selected[0].label : "—");

  return (
    <span className="cp-pop" ref={box}>
      <FieldControl icon={multi ? null : (selected[0] && selected[0].icon)} label={label}
                    dim={multi && selected.length === 0} onClick={() => setOpen((o) => !o)} />
      {open ? (
        <div className="cp-pop-panel">
          <ControlPanel size="menu">
            <ControlPanel.Section>
              <div className="cp-scroll">
                {options.map((o) => (
                  <ControlPanel.Row key={o.id}
                    select={multi ? "check" : "radio"}
                    checked={multi ? value.includes(o.id) : o.id === value}
                    onSelect={() => {
                      if (multi) {
                        onChange(value.includes(o.id) ? value.filter((v) => v !== o.id) : value.concat(o.id));
                      } else { onChange(o.id); setOpen(false); }
                    }}>
                    {o.label}
                  </ControlPanel.Row>
                ))}
              </div>
            </ControlPanel.Section>
          </ControlPanel>
        </div>
      ) : null}
    </span>
  );
}

/* ================================================================== *
 * demo data
 * ================================================================== */

const FIELDS = [
  { id: "title",    label: "Title",    icon: ic.text,   type: "text" },
  { id: "updated",  label: "Updated",  icon: ic.date,   type: "date" },
  { id: "status",   label: "Status",   icon: ic.status, type: "status" },
  { id: "category", label: "Category", icon: ic.tag,    type: "tag" },
  { id: "effort",   label: "Effort",   icon: ic.number, type: "number" },
];
const fieldOf = (id) => FIELDS.filter((f) => f.id === id)[0];

const OPERATORS = {
  text:   [{ id: "contains", label: "Contains" }, { id: "is", label: "Is" }, { id: "empty", label: "Is empty" }],
  date:   [{ id: "after", label: "Is after" }, { id: "before", label: "Is before" }, { id: "within", label: "Is within" }],
  status: [{ id: "is", label: "Is" }, { id: "none-of", label: "Is none of" }, { id: "any-of", label: "Is any of" }],
  tag:    [{ id: "any-of", label: "Is any of" }, { id: "none-of", label: "Is none of" }],
  number: [{ id: "gt", label: "Greater than" }, { id: "lt", label: "Less than" }],
};
const STATUSES = ["Todo", "In progress", "Blocked", "Done", "Dropped"].map((s) => ({ id: s, label: s }));
const WINDOWS = ["Last 7 days", "Last 30 days", "This quarter"].map((s) => ({ id: s, label: s }));

let seq = 100;
const uid = () => "n" + (seq += 1);

/* ================================================================== *
 * the three panels, written against the vocabulary
 * ================================================================== */

function ViewSettingsPanel({ st, set, rails, focused }) {
  return (
    <ControlPanel size="menu" rails={rails} focused={focused}>
      <ControlPanel.Section label="Properties">
        {st.properties.map((p) => (
          <ControlPanel.Row key={p.id} handle select="check" checked={p.visible}
            onSelect={() => set({ properties: st.properties.map((q) => q.id === p.id ? { ...q, visible: !q.visible } : q) })}>
            {fieldOf(p.id).label}
          </ControlPanel.Row>
        ))}
      </ControlPanel.Section>

      <ControlPanel.Section label="Group by">
        {[{ id: "none", label: "None" }, { id: "status", label: "Status" }, { id: "category", label: "Category" }].map((o) => (
          <ControlPanel.Row key={o.id} select="radio" checked={st.groupBy === o.id}
            onSelect={() => set({ groupBy: o.id })}>{o.label}</ControlPanel.Row>
        ))}
      </ControlPanel.Section>

      <ControlPanel.Section label="Display">
        <ControlPanel.Row select="switch" checked={st.showSubtasks}
          onSelect={() => set({ showSubtasks: !st.showSubtasks })}>Show sub-tasks</ControlPanel.Row>
        <ControlPanel.Row select="switch" checked={st.wrapTitles}
          onSelect={() => set({ wrapTitles: !st.wrapTitles })}>Wrap long titles</ControlPanel.Row>
      </ControlPanel.Section>

      <ControlPanel.Section label="Fields">
        {st.customFields.length === 0
          ? <ControlPanel.Empty>No custom fields yet.</ControlPanel.Empty>
          : st.customFields.map((f) => (
              <ControlPanel.Row key={f.id} handle icon={ic.number} trailing={f.type}
                onSelect={() => {}}>{f.label}</ControlPanel.Row>
            ))}
        <ControlPanel.Row icon={ic.plus} muted
          onSelect={() => set({ customFields: st.customFields.concat({ id: uid(), label: "Untitled", type: "Number" }) })}>
          New field
        </ControlPanel.Row>
      </ControlPanel.Section>

      <ControlPanel.Footer>
        <ControlPanel.Row icon={ic.eye}
          onSelect={() => set({ properties: st.properties.map((p) => ({ ...p, visible: true })) })}>
          Show all properties
        </ControlPanel.Row>
      </ControlPanel.Footer>
    </ControlPanel>
  );
}

function FilterPanel({ st, set, rails, focused }) {
  const rules = st.filterRules;
  const patch = (id, next) => set({ filterRules: rules.map((r) => r.id === id ? { ...r, ...next } : r) });

  const valueFor = (r) => {
    const type = fieldOf(r.fieldId).type;
    if (r.opId === "empty") return null;
    if (type === "status" || type === "tag") {
      return <Picker multi value={r.value || []} options={STATUSES} onChange={(v) => patch(r.id, { value: v })} />;
    }
    if (type === "date") {
      return <Picker value={r.value} options={WINDOWS} onChange={(v) => patch(r.id, { value: v })} />;
    }
    return <FieldControl label={r.value || "Type a value…"} dim={!r.value} onClick={() => {}} />;
  };

  return (
    <ControlPanel size="builder" rails={rails} focused={focused}>
      <ControlPanel.Section label="Presets">
        <ControlPanel.Row select="radio" checked={st.preset === "hide-completed"}
          onSelect={() => set({ preset: st.preset === "hide-completed" ? null : "hide-completed" })}>
          Hide completed
        </ControlPanel.Row>
        <ControlPanel.Row select="radio" checked={st.preset === "mine-this-week"}
          onSelect={() => set({ preset: st.preset === "mine-this-week" ? null : "mine-this-week" })}>
          Mine, this week
        </ControlPanel.Row>
      </ControlPanel.Section>

      <ControlPanel.Section>
        <ControlPanel.RuleList>
          {rules.map((r, i) => (
            <ControlPanel.RuleRow key={r.id}
              prefix={i === 0
                ? "Where"
                : <Picker value={st.conjunction} options={[{ id: "and", label: "And" }, { id: "or", label: "Or" }]}
                          onChange={(v) => set({ conjunction: v })} />}
              field={<Picker value={r.fieldId} options={FIELDS}
                             onChange={(v) => patch(r.id, { fieldId: v, opId: OPERATORS[fieldOf(v).type][0].id, value: null })} />}
              operator={<Picker value={r.opId} options={OPERATORS[fieldOf(r.fieldId).type]}
                                onChange={(v) => patch(r.id, { opId: v })} />}
              value={valueFor(r)}
              onRemove={() => set({ filterRules: rules.filter((x) => x.id !== r.id) })} />
          ))}
        </ControlPanel.RuleList>
        {rules.length === 0 ? <ControlPanel.Empty>No filters yet.</ControlPanel.Empty> : null}
        <ControlPanel.Row icon={ic.plus} muted
          onSelect={() => set({ filterRules: rules.concat({ id: uid(), fieldId: "title", opId: "contains", value: "" }) })}>
          Add filter
        </ControlPanel.Row>
      </ControlPanel.Section>

      <ControlPanel.Footer>
        <ControlPanel.Row icon={ic.bookmark} onSelect={() => {}}>Save as preset</ControlPanel.Row>
        <ControlPanel.Row icon={ic.trash} tone="danger" onSelect={() => set({ filterRules: [] })}>
          Clear filter
        </ControlPanel.Row>
      </ControlPanel.Footer>
    </ControlPanel>
  );
}

function SortPanel({ st, set, rails, focused }) {
  const rules = st.sortRules;
  const patch = (id, next) => set({ sortRules: rules.map((r) => r.id === id ? { ...r, ...next } : r) });
  const used = rules.map((r) => r.fieldId);
  const free = FIELDS.filter((f) => used.indexOf(f.id) === -1);

  return (
    <ControlPanel size="builder" rails={rails} focused={focused}>
      <ControlPanel.Section>
        <ControlPanel.RuleList>
          {rules.map((r, i) => (
            <ControlPanel.RuleRow key={r.id} handle
              prefix={i === 0 ? "Sort by" : "then by"}
              field={<Picker value={r.fieldId} options={FIELDS.filter((f) => f.id === r.fieldId || free.indexOf(f) !== -1)}
                             onChange={(v) => patch(r.id, { fieldId: v })} />}
              value={<Picker value={r.dir}
                             options={[{ id: "asc", label: "Ascending" }, { id: "desc", label: "Descending" }]}
                             onChange={(v) => patch(r.id, { dir: v })} />}
              onRemove={() => set({ sortRules: rules.filter((x) => x.id !== r.id) })} />
          ))}
        </ControlPanel.RuleList>
        {rules.length === 0 ? <ControlPanel.Empty>No sorts yet.</ControlPanel.Empty> : null}
        {free.length > 0 ? (
          <ControlPanel.Row icon={ic.plus} muted
            onSelect={() => set({ sortRules: rules.concat({ id: uid(), fieldId: free[0].id, dir: "asc" }) })}>
            Add sort
          </ControlPanel.Row>
        ) : null}
      </ControlPanel.Section>

      <ControlPanel.Footer>
        <ControlPanel.Row icon={ic.bookmark} onSelect={() => {}}>Save as preset</ControlPanel.Row>
        <ControlPanel.Row icon={ic.trash} tone="danger" onSelect={() => set({ sortRules: [] })}>
          Clear sort
        </ControlPanel.Row>
      </ControlPanel.Footer>
    </ControlPanel>
  );
}

/* ================================================================== *
 * the toolbar — one registry, one trigger rendering
 * ================================================================== */

function summarizeFilter(st) {
  const rules = st.filterRules;
  if (rules.length === 0) {
    return st.preset ? { text: st.preset === "hide-completed" ? "Hide completed" : "Mine, this week", more: 0 } : null;
  }
  const r = rules[0];
  const type = fieldOf(r.fieldId).type;
  const op = OPERATORS[type].filter((o) => o.id === r.opId)[0];
  let v = "";
  if (r.opId !== "empty") {
    if (Array.isArray(r.value)) v = r.value.length === 1 ? r.value[0] : r.value.length + "";
    else v = r.value || "…";
  }
  const head = fieldOf(r.fieldId).label + " " + op.label.toLowerCase() + (v ? " " + v : "");
  return { text: head, more: rules.length - 1 };
}

function summarizeSort(st) {
  const rules = st.sortRules;
  if (rules.length === 0) return null;
  const head = fieldOf(rules[0].fieldId).label + (rules[0].dir === "asc" ? " ↑" : " ↓");
  return { text: head, more: rules.length - 1 };
}

function ControlTrigger({ control, focused, onFocus }) {
  const active = control.summary !== null && control.summary !== undefined;
  return (
    <button className="ctl-trigger" type="button" title={control.label}
            data-active={active ? "true" : "false"}
            data-focused={focused ? "true" : "false"}
            onClick={onFocus}>
      {control.icon}
      {active ? (
        <span className="summary">
          {control.summary.text}
          {control.summary.more > 0 ? <em>+{control.summary.more}</em> : null}
        </span>
      ) : null}
    </button>
  );
}

/* ================================================================== *
 * stage
 * ================================================================== */

function App() {
  const [st, setSt] = useState({
    properties: [
      { id: "title", visible: true }, { id: "updated", visible: true },
      { id: "status", visible: false }, { id: "category", visible: false },
    ],
    groupBy: "category",
    showSubtasks: true,
    wrapTitles: false,
    customFields: [{ id: "cf1", label: "Effort", type: "Number" }],
    preset: null,
    conjunction: "and",
    filterRules: [
      { id: "r1", fieldId: "status", opId: "none-of", value: ["Done", "Dropped"] },
      { id: "r2", fieldId: "updated", opId: "after", value: "Last 30 days" },
    ],
    sortRules: [
      { id: "s1", fieldId: "updated", dir: "desc" },
      { id: "s2", fieldId: "title", dir: "asc" },
    ],
  });
  const set = (patch) => setSt((prev) => ({ ...prev, ...patch }));

  const [rails, setRails] = useState(false);
  const [focus, setFocus] = useState(null);

  /* This array is the proposed registry. The toolbar renders it without
     naming filter, sort or settings anywhere. */
  const controls = [
    { id: "filter",   icon: ic.filter, label: "Filter",        summary: summarizeFilter(st) },
    { id: "sort",     icon: ic.sort,   label: "Sort",          summary: summarizeSort(st) },
    { id: "settings", icon: ic.tune,   label: "View settings", summary: null },
  ];

  return (
    <div className="stage">
      <div className="mock-toolbar">
        {["Tree", "Recent", "Attempted"].map((v, i) => (
          <span key={v} className="viewchip" data-active={i === 0 ? "true" : "false"}>
            {i === 0 ? ic.list : null}{v}
          </span>
        ))}
        <span className="spacer" />
        <span className="mock-search">{ic.search}Search…</span>
        {controls.map((c) => (
          <ControlTrigger key={c.id} control={c} focused={focus === c.id}
                          onFocus={() => setFocus(focus === c.id ? null : c.id)} />
        ))}
      </div>

      <div className="deck">
        <div className="deck-item">
          <div className="deck-caption">View settings · <b>menu</b></div>
          <ViewSettingsPanel st={st} set={set} rails={rails} focused={focus === "settings"} />
        </div>
        <div className="deck-item">
          <div className="deck-caption">Filter · <b>builder</b></div>
          <FilterPanel st={st} set={set} rails={rails} focused={focus === "filter"} />
        </div>
        <div className="deck-item">
          <div className="deck-caption">Sort · <b>builder</b></div>
          <SortPanel st={st} set={set} rails={rails} focused={focus === "sort"} />
        </div>
      </div>

      <div className="deck-note">
        <label>
          <input type="checkbox" checked={rails} onChange={(e) => setRails(e.target.checked)} />
          Show the alignment rails
        </label>
        <span>Everything is live — tick, pick, add and remove. The toolbar chips restate what each control is doing.</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
