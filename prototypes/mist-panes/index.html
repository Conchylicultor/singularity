<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Mist panes</title>
<meta name="description" content="Cool dark conversation layout — rail, sidebar, and main thread — explored across three pane surfaces: flush hairlines, floating cards, and raised soft trays. Flip between them with the bottom-right switcher." />
<meta name="prototype-viewport" content="1320x868" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  #root { width: 1320px; height: 868px; overflow: hidden; }
</style>
</head>
<body class="theme-mist">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<!-- The JSX lives inline: Babel fetches a `src` file over XHR, which the
     browser blocks on file://, and this file must open by double-click. -->
<script type="text/babel" data-presets="react">
/* ===== icons ===== */
/* Icon helper — Lucide line icons (soft, friendly).
   Renders a placeholder <i> that lucide.createIcons() swaps for an <svg>.
   Exposes window.Ic. */
function Ic({ name, size, color, className }) {
  const style = {};
  if (size) style.fontSize = typeof size === "number" ? size + "px" : size;
  if (color) style.color = color;
  return <i data-lucide={name} style={style} className={"lic " + (className || "")} />;
}

window.Ic = Ic;

/* ===== sidebar ===== */
/* Far-left rail + conversation sidebar. Exposes Rail, Sidebar, Conv, Dots. */

const RAIL_ICONS = [
  { name: "messages-square", active: true },
  { name: "bug" },
  { name: "cloud" },
  { name: "folder" },
  { name: "house" },
  { name: "file-text" },
  { name: "book-open" },
  { name: "puzzle" },
];

const NAV = [
  { name: "Agents", icon: "bot" },
  { name: "Accounts", icon: "key-round" },
  { name: "Explorer", icon: "compass" },
  { name: "Config", icon: "sliders-horizontal" },
];

const QUEUE = [
  { id: "q1", title: "Fix app UI structure and styling", icon: "factory", av: "var(--green)", dots: [1,0,0,0,0], time: "11m ago" },
  { id: "q2", title: "Add icon selector primitive co…", icon: "shapes", av: "var(--muted)", dim: true, dots: [], time: "11m ago", q: true },
  { id: "q3", title: "Design prompt-form step type …", icon: "star", av: "var(--amber)", dots: [1,0,0,0], time: "7d ago" },
  { id: "q4", title: "Rebase branch to head", icon: "circle-help", av: "var(--blue)", dots: [1,1,1,0], time: "6d ago", badge: 2 },
  { id: "q5", title: "Evaluate sync API design with …", icon: "factory", av: "var(--green)", dots: [1,1,1,1], time: "44d ago" },
  { id: "q6", title: "Investigate app performance b…", icon: "factory", av: "var(--green)", dots: [1,1,0,0], time: "2d ago" },
];

const WORKING = [
  { id: "w1", title: "Add alias/synonym search…", icon: "search", av: "var(--muted)", dim: true, dots: [], time: "10m ago", q: true },
  { id: "w2", title: "Remove colors from avata…", icon: "star", av: "var(--amber)", dots: [1,1,1,0], time: "11m ago", glass: true, active: true },
  { id: "w3", title: "Fix nested button footgun i…", icon: "sparkles", av: "var(--violet)", dots: [1,1,1,0], time: "3h ago", up: true },
  { id: "w4", title: "Hardcode reorderable con…", icon: "star", av: "var(--amber)", dots: [1,1,0,0], time: "58m ago" },
  { id: "w5", title: "Remove legacy raw-fetch …", icon: "factory", av: "var(--green)", dots: [1,1,1,0], time: "14h ago", glass: true },
];

function Dots({ dots, q }) {
  if (q) return <span className="dots"><i className="q" /></span>;
  if (!dots || !dots.length) return null;
  return (
    <span className="dots">
      {dots.map((d, i) => <i key={i} className={d ? "on" : ""} />)}
    </span>
  );
}

function Conv({ c, active, onClick }) {
  return (
    <div className={"conv" + (c.dim ? " dim" : "") + (active ? " active" : "")} onClick={onClick}>
      <div className="avatar" style={{ "--av": c.av }}><Ic name={c.icon} /></div>
      <div className="conv-body">
        <div className="conv-title">{c.title}</div>
        <div className="conv-meta">
          <Dots dots={c.dots} q={c.q} />
          {c.glass && <span className="hourglass"><Ic name="hourglass" /></span>}
          {c.up && <span style={{ color: "var(--muted)", fontSize: 13 }}><Ic name="upload" /></span>}
          <span className="conv-time">{c.time}</span>
        </div>
      </div>
      {c.badge && <span className="pill-badge">{c.badge}</span>}
    </div>
  );
}

function Rail() {
  return (
    <div className="rail">
      <div className="mark"><Ic name="orbit" /></div>
      {RAIL_ICONS.map((r, i) => (
        <div key={i} className={"rail-btn" + (r.active ? " active" : "")}><Ic name={r.name} /></div>
      ))}
      <div className="spacer" />
      <div className="rail-btn"><Ic name="git-branch" /></div>
    </div>
  );
}

function Sidebar({ selected, onSelect, tab, onTab }) {
  const [navActive, setNavActive] = React.useState(null);
  const [qOpen, setQOpen] = React.useState(true);
  const [wOpen, setWOpen] = React.useState(true);

  return (
    <div className="sidebar">
      <div className="brand">
        <div className="logo"><Ic name="orbit" /></div>
        <div className="name">Singularity</div>
      </div>

      <div className="nav">
        {NAV.map((n) => (
          <div key={n.name}
               className={"nav-item" + (navActive === n.name ? " active" : "")}
               onClick={() => setNavActive(n.name)}>
            <span className="ic"><Ic name={n.icon} /></span>{n.name}
          </div>
        ))}
      </div>

      <div className="sb-divider" />

      <div className="section-head">
        <span className="ic"><Ic name="messages-square" /></span>
        Conversations
        <span className="chev"><Ic name="chevron-down" /></span>
      </div>

      <div className="model-row">
        <div className="model-pick"><span className="dot" />Opus 4.8<span className="chev"><Ic name="chevron-down" /></span></div>
        <div className="run-btn"><Ic name="play" /></div>
      </div>

      <div className="tabs">
        {[["Queue","list-ordered"],["Grouped","boxes"],["History","history"]].map(([t,ic]) => (
          <div key={t} className={"tab" + (tab === t ? " active" : "")} onClick={() => onTab(t)}>
            <span className="ic"><Ic name={ic} /></span>{t}
          </div>
        ))}
      </div>

      <div className="conv-scroll">
        <div className="group">
          <div className={"group-head" + (qOpen ? "" : " collapsed")} onClick={() => setQOpen(!qOpen)}>
            <span className="chev"><Ic name="chevron-down" /></span>Queue
            <span className="count">{QUEUE.length}</span>
          </div>
          {qOpen && QUEUE.map((c) => (
            <Conv key={c.id} c={c} active={selected === c.id} onClick={() => onSelect(c.id)} />
          ))}
        </div>

        <div className="group">
          <div className={"group-head" + (wOpen ? "" : " collapsed")} onClick={() => setWOpen(!wOpen)}>
            <span className="chev"><Ic name="chevron-down" /></span>Working
            <span className="count">{WORKING.length}</span>
          </div>
          {wOpen && WORKING.map((c) => (
            <Conv key={c.id} c={c} active={selected === c.id} onClick={() => onSelect(c.id)} />
          ))}
        </div>
      </div>

      <div className="sb-foot">
        <div className="nav-item"><span className="ic"><Ic name="sparkles" /></span>Stats</div>
        <div className="nav-item"><span className="ic"><Ic name="square-check-big" /></span>Tasks</div>
      </div>
    </div>
  );
}

Object.assign(window, { Rail, Sidebar, Conv, Dots, QUEUE, WORKING });

/* ===== thread ===== */
/* Main column: top bar, sub-header, toolbar, conversation thread, composer.
   Exposes TopBar, SubHeader, Toolbar, Thread, Composer, Split. */

function TopBar() {
  return (
    <div className="topbar">
      <div className="icon-btn"><Ic name="panel-left" /></div>
      <div className="crumb"><span className="dot" />singularity</div>
      <div className="seg-pill"><span className="dot" />Build</div>
      <div className="grow" />
      <div className="icon-btn"><Ic name="bell" /></div>
      <div className="icon-btn"><Ic name="pen-line" /></div>
      <div className="icon-btn"><Ic name="camera" /></div>
      <div className="icon-btn"><Ic name="sun" /></div>
      <div className="icon-btn"><Ic name="pencil" /></div>
      <button className="improve"><Ic name="sparkles" />Improve</button>
    </div>
  );
}

function SubHeader({ title }) {
  return (
    <div className="subhead">
      <h1>{title}</h1>
      <span className="tag">Feature (small)</span>
      <div className="stepper">
        <i className="done" /><span className="bar done" />
        <i className="done" /><span className="bar done" />
        <i className="now" /><span className="bar" />
        <i /><span className="stepper-label">Implementation</span>
      </div>
      <div className="grow" />
      <span className="chip">Opus 4.8</span>
      <span className="chip live">Working</span>
    </div>
  );
}

function Toolbar() {
  return (
    <div className="toolbar">
      <div className="tool"><span className="ic"><Ic name="layout-panel-left" /></span>1</div>
      <div className="tool"><span className="ic"><Ic name="folder" /></span></div>
      <div className="tool"><span className="ic"><Ic name="message-square" /></span>0</div>
      <div className="tool"><span className="ic"><Ic name="git-branch" /></span><Ic name="arrow-up" />0</div>
      <div className="tool"><span className="ic"><Ic name="git-commit-horizontal" /></span>43</div>
      <div className="sep" />
      <div className="tool"><span className="ic"><Ic name="rocket" /></span></div>
      <div className="tool"><span className="ic"><Ic name="activity" /></span></div>
      <div className="tool"><span className="ic"><Ic name="list-checks" /></span><span className="b" /></div>
      <div className="tool"><span className="ic"><Ic name="square-terminal" /></span></div>
      <div className="tool"><span className="ic"><Ic name="code-xml" /></span></div>
      <div className="sep" />
      <div className="tool"><span className="ic"><Ic name="file-diff" /></span>3
        <span className="diff"><span className="add">+6</span> <span className="del">−8</span></span>
      </div>
      <div className="tool plugins"><span className="ic"><Ic name="plug" /></span>3 plugins</div>
    </div>
  );
}

function Thread({ messages }) {
  const [reminderOpen, setReminderOpen] = React.useState(false);
  return (
    <div className="thread" data-thread>
      <div className="thread-inner">
        <div className="msg-user">Remove the colors in the avatar icons displayed in the conversation list</div>

        <div className="msg-block">
          <div className="bullet">
            <span className="dot"><Ic name="dot" size={16} /></span>
            <div>
              <code className="path">plugins/agents/web/components/agent-avatar-row.tsx</code>{" "}
              — pass <code className="kw">colorless</code>; dropped <code className="tok">color</code> / <code className="tok">fallbackKey</code>.
            </div>
          </div>
          <p>
            Both <code>Item.Avatar</code> contributors (non-agent category avatars and agent avatars) now render colorless,
            covering every surface that lists conversations. The change is scoped to these contributors, so other avatar
            usages (agent detail, category toolbar pills) keep their colors. Deployed to{" "}
            <a href="#">att-1781010506-shuc.localhost:9000</a>.
          </p>
        </div>

        <div className="msg-block wrap-note">
          <p style={{ color: "var(--text)", fontWeight: 600 }}>Please wrap up this conversation:</p>
          <ol>
            <li>Push this branch to main using the CLI.</li>
            <li>Then call exactly one MCP tool to signal the outcome:
              <ul style={{ margin: "6px 0", paddingLeft: 18, listStyle: "none" }}>
                <li>— <code className="kw">exit_clean</code> — everything went smoothly, nothing I need to know. The conversation will close automatically.</li>
                <li>— <code className="kw">flag_raise(&#123; reason &#125;)</code> — something needs my attention (caveats, partial outcomes, follow-ups, skipped work, or the push didn't land). Use <code>reason</code> for short bullets.</li>
              </ul>
            </li>
            <li>Write your final wrap-up message, including summary, issues encountered, existing caveats, follow-ups.</li>
          </ol>
        </div>

        <div className="collapsible" onClick={() => setReminderOpen(!reminderOpen)}>
          <span className="chev" style={{ transform: reminderOpen ? "rotate(90deg)" : "none" }}><Ic name="chevron-right" /></span>
          Task Reminder (no tasks)
        </div>

        <div className="msg-assistant">I'll commit and push the branch to main using the CLI.</div>

        <div className="tool-card">
          <span className="badge">Bash</span>
          <span className="label">Commit and push branch to main</span>
          <span className="more"><Ic name="ellipsis" /></span>
        </div>

        {messages.map((m, i) => (
          <div key={i} className="msg-user sent">{m}</div>
        ))}

        <div className="working">
          <span className="pulse"><i /><i /><i /></span>
          Working for 33s
        </div>

        <div className="ctx-meta"><b>76k</b> ctx · <b>11k</b> out</div>

        <div className="alert">
          <span className="ic"><Ic name="hourglass" /></span>
          Push queued — waiting for lock
          <span className="grow" />
          <span className="more">+2 others 0:28 <Ic name="chevron-down" size={13} /></span>
        </div>
      </div>
    </div>
  );
}

function Composer({ onSend }) {
  const [val, setVal] = React.useState("");
  const ref = React.useRef(null);
  const send = () => { const v = val.trim(); if (!v) return; onSend(v); setVal(""); if (ref.current) ref.current.style.height = "24px"; };
  const onKey = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  const grow = (e) => { setVal(e.target.value); e.target.style.height = "24px"; e.target.style.height = e.target.scrollHeight + "px"; };

  return (
    <div className="composer">
      <div className="composer-inner">
        <div className="input-box">
          <textarea ref={ref} rows={1} value={val} onChange={grow} onKeyDown={onKey}
            placeholder="Send a message — Enter to send, Shift+Enter for newline" />
          <div className="compose-actions">
            <div className="foot-mini"><Ic name="share" /></div>
            <Split label="Question only" icon="message-circle-question" />
            <Split label="Sonnet" icon="pen-line" />
            <Split label="Go" icon="pen-line" />
            <Split label="Rebase" icon="pen-line" />
            <div className="foot-mini"><Ic name="pencil" /></div>
            <div className="grow" />
            <button className="stop-btn" onClick={send}><Ic name="square" />Stop</button>
            <div className="mic-btn"><Ic name="mic" /></div>
          </div>
        </div>
        <div className="compose-foot">
          <span className="foot-pill"><Ic name="git-branch" />Branch</span>
          <span className="foot-mini"><Ic name="arrow-left" /></span>
          <span className="foot-mini"><Ic name="link" /></span>
          <span className="foot-mini"><Ic name="arrow-right" /></span>
          <span className="foot-mini"><Ic name="arrow-up-down" /></span>
          <span className="foot-pill"><span style={{ width: 7, height: 7, borderRadius: 9, background: "var(--accent)" }} />Opus 4.8 <Ic name="chevron-down" size={13} /></span>
          <span className="foot-mini" style={{ color: "var(--accent)" }}><Ic name="play" /></span>
          <span className="foot-mini"><Ic name="sticky-note" /></span>
        </div>
      </div>
    </div>
  );
}

function Split({ label, icon }) {
  return (
    <div className="split">
      <div className="main-b"><Ic name={icon} />{label}</div>
      <div className="arr"><Ic name="chevron-right" size={13} /></div>
    </div>
  );
}

Object.assign(window, { TopBar, SubHeader, Toolbar, Thread, Composer, Split });

/* ===== app ===== */
/* Mist panes — flush / floating / soft-tray surface explorations of one
   conversation layout. Defines window.App.

   The classic arrangement (Rail · Sidebar · Main) stays put; only the
   surface/shape of the panes changes between the three "pane" looks.
   A small in-canvas switcher (bottom-right) lets you flip between them —
   the host app owns Focus/Compare/scaling, so there is no harness chrome here. */

const PANES = [
  { id: "flush", name: "Flush",     blurb: "Edge-to-edge · hairlines" },
  { id: "float", name: "Floating",  blurb: "Rounded cards · shadow" },
  { id: "soft",  name: "Soft tray", blurb: "Raised rounded trays" },
];

/* tiny diagram of each pane design for the switcher */
function PaneMini({ id }) {
  if (id === "float") return (
    <span className="pm pm-float"><span className="a" /><span className="b" /></span>
  );
  if (id === "soft") return (
    <span className="pm pm-soft">
      <span className="a"><i /><i /></span>
      <span className="b"><i /><i /></span>
    </span>
  );
  return <span className="pm pm-flush"><span className="a" /><span className="b" /></span>;
}

function PaneSwitch({ pane, onPick }) {
  return (
    <div className="pane-switch">
      {PANES.map((p) => (
        <button key={p.id}
          className={"ps-btn" + (pane === p.id ? " active" : "")}
          onClick={() => onPick(p.id)}
          title={p.blurb}>
          <PaneMini id={p.id} />{p.name}
        </button>
      ))}
    </div>
  );
}

function App() {
  const [pane, setPane] = React.useState("flush");
  const [selected, setSelected] = React.useState("w2");
  const [tab, setTab] = React.useState("Queue");
  const [messages, setMessages] = React.useState([]);

  // Re-swap lucide placeholders after every render (state changes add new ones).
  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  return (
    <div className={"app theme-mist pane-" + pane}>
      <Rail />
      <Sidebar selected={selected} onSelect={setSelected} tab={tab} onTab={setTab} />
      <div className="main">
        <TopBar />
        <SubHeader title="Remove colors from avatar icons in conversation list" />
        <Toolbar />
        <Thread messages={messages} />
        <Composer onSend={(m) => setMessages((xs) => [...xs, m])} />
      </div>
      <PaneSwitch pane={pane} onPick={setPane} />
    </div>
  );
}

window.App = App;

/* ===== mount ===== */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
