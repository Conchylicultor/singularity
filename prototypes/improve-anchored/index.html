<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Improve — anchored popover</title>
<meta name="description" content="Not a modal at all. Improve hangs off its own toolbar button with the page still visible behind it; attachments show as real thumbnails, and chaining a second task threads it below the first while the run settings stay folded behind one disclosure. Live — add, remove and switch tasks." />
<meta name="prototype-viewport" content="1280x800" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  :root {
    --bg:        #0f0f11;
    --surface:   #1c1c1f;
    --raised:    #232327;
    --line:      rgba(255,255,255,.07);
    --line-firm: rgba(255,255,255,.12);
    --ink:       #eaeaec;
    --ink-2:     #a0a0a8;
    --ink-3:     #6b6b75;
    --accent:    #cf7458;
    --accent-hi: #de8a6f;
    --focus:     rgba(207,116,88,.5);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  #root { width: 1280px; height: 800px; overflow: hidden; position: relative; }

  /* ---------------- the live app, undimmed ---------------- */
  .toolbar {
    height: 40px; display: flex; align-items: center; gap: 6px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--line);
    background: #17171a;
  }
  .brand { font-size: 12.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
  .tab { height: 24px; padding: 0 10px; display: grid; place-items: center; border-radius: 6px; font-size: 12px; color: var(--ink-3); }
  .tab.on { background: rgba(255,255,255,.07); color: var(--ink); }

  .tbtn {
    width: 28px; height: 28px; display: grid; place-items: center;
    border: 0; border-radius: 7px; background: transparent; color: var(--ink-3);
    cursor: pointer; transition: background .13s, color .13s;
  }
  .tbtn:hover { background: rgba(255,255,255,.07); color: var(--ink); }
  .tbtn.active { background: rgba(207,116,88,.16); color: var(--accent-hi); }
  .avatar { width: 24px; height: 24px; border-radius: 999px; background: linear-gradient(150deg,#3a3a42,#26262b); border: 1px solid rgba(255,255,255,.1); margin-left: 2px; }

  .page { padding: 30px 40px; display: flex; flex-direction: column; gap: 18px; }
  .h { font-size: 19px; font-weight: 620; letter-spacing: -.01em; }
  .card {
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    background: #151517; display: flex; flex-direction: column; gap: 10px;
    max-width: 720px;
  }
  .bar { height: 10px; border-radius: 4px; background: rgba(255,255,255,.06); }

  /* ---------------- popover ---------------- */
  .pop {
    position: absolute; top: 46px; right: 14px; width: 396px;
    background: var(--surface);
    border: 1px solid var(--line-firm);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 20px 48px -10px rgba(0,0,0,.75);
    overflow: hidden;
  }
  .tail {
    position: absolute; top: -6px; right: 34px;
    width: 11px; height: 11px; transform: rotate(45deg);
    background: var(--surface);
    border-left: 1px solid var(--line-firm);
    border-top: 1px solid var(--line-firm);
    border-radius: 2px;
  }

  .pop-head { display: flex; align-items: center; gap: 7px; padding: 11px 12px 5px 14px; }
  .pop-head .t { font-size: 12.5px; font-weight: 590; color: var(--ink-2); }
  .pop-head .count { font-size: 11.5px; color: var(--ink-3); }
  .spring { flex: 1; }

  /* ---------------- task stack ---------------- */
  .body {
    padding: 9px 14px 0;
    max-height: 380px; overflow-y: auto;
  }
  /* a rule appears under the title once the stack scrolls beneath it */
  .body.scrolled { box-shadow: inset 0 1px 0 var(--line-firm); }
  .body::-webkit-scrollbar { width: 9px; }
  .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 9px; border: 3px solid transparent; background-clip: content-box; }

  .task { position: relative; }

  .task-head { display: none; align-items: center; gap: 7px; height: 21px; margin-bottom: 1px; }
  .pop.multi .task-head { display: flex; }
  .num {
    width: 16px; height: 16px; flex: none; display: grid; place-items: center;
    border-radius: 5px; background: rgba(255,255,255,.07);
    font-size: 10px; font-weight: 640; color: var(--ink-3);
    transition: background .14s, color .14s;
  }
  .task.sel .num { background: rgba(207,116,88,.22); color: var(--accent-hi); }
  .task-head .chain { font-size: 11px; color: var(--ink-3); }

  textarea {
    display: block; width: 100%; min-height: 40px;
    background: transparent; border: 0; outline: 0; resize: none;
    color: var(--ink); font: inherit; font-size: 14.5px; line-height: 1.5;
    padding: 0 0 4px;
  }
  .pop:not(.multi) textarea { min-height: 78px; }
  textarea::placeholder { color: var(--ink-3); }

  .then {
    display: flex; align-items: center; gap: 9px;
    margin: 9px 0 11px;
    font-size: 10px; font-weight: 620; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .then::before, .then::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .then::before { max-width: 6px; }

  /* attachment: shown, not checkboxed */
  .attached {
    display: flex; align-items: center; gap: 10px;
    margin: 4px 0 8px; padding: 7px 8px 7px 7px;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(255,255,255,.025);
  }
  .thumb {
    width: 54px; height: 36px; flex: none; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--line-firm);
    background: linear-gradient(160deg, #26262b, #17171a);
    padding: 4px 5px; display: flex; flex-direction: column; gap: 3px;
  }
  .thumb i { display: block; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); }
  .thumb i:nth-child(1) { width: 60%; background: rgba(207,116,88,.5); }
  .thumb i:nth-child(2) { width: 100%; }
  .thumb i:nth-child(3) { width: 82%; }
  .thumb i:nth-child(4) { width: 44%; }

  .att-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .att-meta .n { font-size: 12.5px; font-weight: 520; }
  .att-meta .u {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-x {
    width: 24px; height: 24px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 6px; background: transparent; color: var(--ink-3);
    cursor: pointer; padding: 0;
  }
  .icon-x:hover { background: rgba(255,255,255,.08); color: var(--ink); }

  .kill {
    width: 20px; height: 20px; opacity: 0;
    transition: opacity .13s, background .13s, color .13s;
  }
  .task:hover .kill, .kill:focus-visible { opacity: 1; }

  .adders { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
  .adder {
    display: inline-flex; align-items: center; gap: 6px;
    height: 27px; padding: 0 9px 0 8px;
    border: 1px solid var(--line-firm); border-radius: 8px;
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background .13s, color .13s, border-color .13s;
  }
  .adder:hover { background: rgba(255,255,255,.055); color: var(--ink); border-color: rgba(255,255,255,.2); }

  /* ---------------- options disclosure ---------------- */
  .disc { border-top: 1px solid var(--line); position: relative; }
  .disc-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    height: 38px; padding: 0 14px; border: 0; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 12.5px; cursor: pointer;
    transition: background .13s, color .13s;
  }
  .disc-btn:hover { background: rgba(255,255,255,.035); color: var(--ink); }
  .disc-btn .chev { transition: transform .18s ease; opacity: .55; }
  .disc[open-state="1"] .disc-btn .chev { transform: rotate(90deg); }
  .summary {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--ink-3);
  }
  .summary b { font-weight: 520; color: var(--ink-2); }

  .disc-body { display: none; padding: 2px 14px 12px; }
  .disc[open-state="1"] .disc-body { display: block; }

  .field { display: flex; align-items: center; gap: 12px; height: 34px; }
  .field > label { width: 92px; flex: none; font-size: 12px; color: var(--ink-3); }
  .seg {
    display: inline-flex; padding: 2px; gap: 2px;
    border: 1px solid var(--line-firm); border-radius: 8px;
    background: rgba(0,0,0,.22);
  }
  .seg button {
    height: 22px; padding: 0 10px; border: 0; border-radius: 6px;
    background: transparent; color: var(--ink-3);
    font: inherit; font-size: 11.5px; font-weight: 520; cursor: pointer;
    transition: background .13s, color .13s;
  }
  .seg button:hover { color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,.11); color: var(--ink); }

  .select {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 8px 0 10px;
    border: 1px solid var(--line-firm); border-radius: 8px;
    background: rgba(255,255,255,.03); color: var(--ink);
    font: inherit; font-size: 12.5px; cursor: pointer;
    transition: background .13s, border-color .13s;
  }
  .select:hover, .select[aria-expanded="true"] { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.2); }
  .select .caret { opacity: .5; }

  .apply-all {
    display: none; align-items: center; gap: 6px;
    height: 24px; padding: 0 7px; margin-top: 6px; margin-left: 104px;
    border: 0; border-radius: 6px; background: transparent;
    color: var(--ink-3); font: inherit; font-size: 11.5px; cursor: pointer;
    transition: background .13s, color .13s;
  }
  .pop.multi .apply-all { display: inline-flex; }
  .apply-all:hover { background: rgba(255,255,255,.06); color: var(--ink-2); }
  .apply-all.done { color: var(--accent-hi); }

  /* ---------------- footer ---------------- */
  .foot {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 12px 14px;
    border-top: 1px solid var(--line);
  }
  .link-btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 8px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink-3);
    font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
    transition: background .13s, color .13s;
  }
  .link-btn:hover { background: rgba(255,255,255,.06); color: var(--ink); }

  .btn {
    height: 30px; padding: 0 13px; border: 1px solid transparent; border-radius: 8px;
    font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer;
    transition: background .13s, color .13s, transform .06s;
  }
  .btn:active { transform: translateY(.5px); }
  .btn-quiet { background: transparent; color: var(--ink-2); }
  .btn-quiet:hover { background: rgba(255,255,255,.07); color: var(--ink); }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent); color: #17110e;
    box-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 1px 3px rgba(0,0,0,.45);
  }
  .btn-primary:hover { background: var(--accent-hi); }
  .btn-primary kbd { font: inherit; font-size: 10.5px; font-weight: 620; color: rgba(23,17,14,.58); }

  :is(button, textarea):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------------- menu ---------------- */
  .menu {
    position: absolute; z-index: 10;
    width: 176px; padding: 5px;
    background: var(--raised);
    border: 1px solid var(--line-firm);
    border-radius: 11px;
    box-shadow: 0 12px 32px -8px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4);
  }
  .menu-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    height: 28px; padding: 0 8px; border: 0; border-radius: 7px;
    background: transparent; color: var(--ink-2);
    font: inherit; font-size: 12.5px; text-align: left; cursor: pointer;
  }
  .menu-item:hover { background: rgba(255,255,255,.07); color: var(--ink); }
  .menu-item[aria-checked="true"] { color: var(--ink); }
  .menu-item .tick { margin-left: auto; color: var(--accent); opacity: 0; }
  .menu-item[aria-checked="true"] .tick { opacity: 1; }

  /* ---------------- filed toast ---------------- */
  .filed {
    position: absolute; bottom: 22px; right: 22px; max-width: 460px;
    padding: 12px 15px;
    background: var(--raised);
    border: 1px solid var(--line-firm); border-radius: 12px;
    box-shadow: 0 16px 40px -10px rgba(0,0,0,.7);
    display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; color: var(--ink-2);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 30;
  }
  .filed.show { opacity: 1; transform: none; }
  .filed > svg { color: var(--accent); flex: none; }
  .filed b { color: var(--ink); font-weight: 560; }
</style>
</head>
<body>
<div id="root">

  <div class="toolbar">
    <span class="brand">singularity</span>
    <div style="width:10px"></div>
    <span class="tab on">Tasks</span>
    <span class="tab">Agents</span>
    <span class="tab">Pages</span>
    <div class="spring"></div>
    <button class="tbtn" title="Theme">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg>
    </button>
    <button class="tbtn active" title="Improve this app">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <path d="M8 1.8 9.5 5.6 13.3 7 9.5 8.4 8 12.2 6.5 8.4 2.7 7 6.5 5.6z"/><path d="M12.4 10.6l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/>
      </svg>
    </button>
    <div class="avatar"></div>
  </div>

  <div class="page">
    <div class="h">Tasks</div>
    <div class="card">
      <div class="bar" style="width:38%"></div>
      <div class="bar" style="width:72%"></div>
      <div class="bar" style="width:56%"></div>
    </div>
    <div class="card">
      <div class="bar" style="width:44%"></div>
      <div class="bar" style="width:64%"></div>
    </div>
  </div>

  <!-- ---------------- the popover ---------------- -->
  <div class="pop" id="pop" role="dialog" aria-label="Improve this app">
    <div class="tail"></div>

    <div class="pop-head">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#cf7458" stroke-width="1.4" stroke-linejoin="round">
        <path d="M8 1.8 9.5 5.6 13.3 7 9.5 8.4 8 12.2 6.5 8.4 2.7 7 6.5 5.6z"/>
      </svg>
      <span class="t">Improve this app</span>
      <span class="count" id="count"></span>
      <span class="spring"></span>
      <button class="icon-x" aria-label="Close">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>
      </button>
    </div>

    <div class="body" id="body"></div>

    <!-- everything that used to shout, folded away but never hidden -->
    <div class="disc" id="disc" open-state="0">
      <button class="disc-btn" id="discBtn" aria-expanded="false">
        <svg class="chev" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 3 7.6 6l-3 3"/></svg>
        <span id="discLabel">How it runs</span>
        <span class="summary" id="discSummary"></span>
      </button>

      <div class="disc-body">
        <div class="field">
          <label>Model</label>
          <button class="select" data-menu="model" aria-expanded="false">
            <span data-value="model">Opus 5</span>
            <svg class="caret" width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4.8 3 3 3-3"/></svg>
          </button>
        </div>
        <div class="field">
          <label>Thinking</label>
          <div class="seg" id="seg" role="group" aria-label="Thinking mode">
            <button aria-pressed="true">Default</button>
            <button aria-pressed="false">Think</button>
            <button aria-pressed="false">Hard</button>
          </div>
        </div>
        <div class="field">
          <label>Preprompt</label>
          <button class="select" data-menu="preprompt" aria-expanded="false">
            <span data-value="preprompt">None</span>
            <svg class="caret" width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 4.8 3 3 3-3"/></svg>
          </button>
        </div>
        <button class="apply-all" id="applyAll">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2.4 7.4 2.6 2.6 6.6-6.6"/></svg>
          <span>Use for every task</span>
        </button>
      </div>
    </div>

    <div class="foot">
      <button class="link-btn" id="addTask">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2.8v8.4M2.8 7h8.4"/></svg>
        Another task
      </button>
      <span class="spring"></span>
      <button class="btn btn-quiet">Cancel</button>
      <button class="btn btn-primary" id="submit"><span id="submitLabel">Submit</span> <kbd>⌘↵</kbd></button>
    </div>
  </div>

  <div class="filed" id="filed">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2.4 7.4 2.6 2.6 6.6-6.6"/></svg>
    <span id="filedText"></span>
  </div>
</div>

<script>
  // ---------------------------------------------------------------- data
  const MODELS = ["Opus 5", "Sonnet 5", "Haiku 4.5", "Don't start"];
  const PREPROMPTS = ["None", "UI polish", "Bug hunt", "Refactor"];

  const xIcon =
    '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';
  const tick =
    '<svg class="tick" width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2.8 7.4 2.7 2.7 5.7-6"/></svg>';
  const targetIcon =
    '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7.6 2.2v2.2M7.6 10.8V13M2.2 7.6h2.2M10.8 7.6H13"/><circle cx="7.6" cy="7.6" r="2.4"/></svg>';
  const shotIcon =
    '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.6"/><path d="m4.4 11 2.6-3 2 2.2 1.6-1.6 2.4 2.4"/></svg>';
  const fileIcon =
    '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M7.5 3.2v8.6M3.2 7.5h8.6"/></svg>';

  let nextId = 1;
  const tasks = [];
  let sel = null;

  const pop       = document.getElementById("pop");
  const bodyEl    = document.getElementById("body");
  const countEl   = document.getElementById("count");
  const discLabel = document.getElementById("discLabel");
  const discSum   = document.getElementById("discSummary");
  const submitLbl = document.getElementById("submitLabel");
  const applyAll  = document.getElementById("applyAll");

  // ---------------------------------------------------------------- a task
  function makeTask(text, withShot) {
    const id = nextId++;
    const el = document.createElement("div");
    el.className = "task";
    el.innerHTML = `
      <div class="task-head">
        <span class="num"></span>
        <span class="chain"></span>
        <span class="spring"></span>
        <button class="icon-x kill" aria-label="Remove this task">${xIcon}</button>
      </div>
      <textarea rows="1" placeholder="What's wrong with this screen?"></textarea>
      <div class="att-slot"></div>
      <div class="adders">
        <button class="adder" data-add="shot">${shotIcon} Screenshot</button>
        <button class="adder" data-add="element">${targetIcon} Point at an element</button>
        <button class="adder" data-add="file">${fileIcon} File</button>
      </div>`;

    const t = {
      id, el,
      ta: el.querySelector("textarea"),
      slot: el.querySelector(".att-slot"),
      addersEl: el.querySelector(".adders"),
      shot: !!withShot,
      model: "Opus 5", preprompt: "None", thinking: "Default",
    };
    t.ta.value = text || "";

    const grow = () => { t.ta.style.height = "auto"; t.ta.style.height = t.ta.scrollHeight + "px"; };
    t.ta.addEventListener("input", grow);
    t.ta.addEventListener("focus", () => select(id));
    el.addEventListener("mousedown", () => select(id));
    el.querySelector(".kill").addEventListener("click", (e) => { e.stopPropagation(); removeTask(id); });
    el.querySelector('[data-add="shot"]').addEventListener("click", (e) => {
      e.stopPropagation(); select(id); t.shot = true; renderAttachment(t);
    });

    renderAttachment(t);
    requestAnimationFrame(grow);
    return t;
  }

  function renderAttachment(t) {
    t.slot.innerHTML = "";
    t.addersEl.querySelector('[data-add="shot"]').style.display = t.shot ? "none" : "";
    if (!t.shot) return;

    const a = document.createElement("div");
    a.className = "attached";
    a.innerHTML = `
      <div class="thumb" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="att-meta">
        <span class="n">This screen</span>
        <span class="u">/tasks — captured just now</span>
      </div>
      <button class="icon-x" aria-label="Remove attachment">${xIcon}</button>`;
    a.querySelector(".icon-x").addEventListener("click", (e) => {
      e.stopPropagation(); t.shot = false; renderAttachment(t);
    });
    t.slot.appendChild(a);
  }

  // ---------------------------------------------------------------- chain
  function rebuild(focusId) {
    bodyEl.innerHTML = "";
    tasks.forEach((t, i) => {
      if (i > 0) {
        const rule = document.createElement("div");
        rule.className = "then";
        rule.textContent = "then";
        bodyEl.appendChild(rule);
      }
      bodyEl.appendChild(t.el);
    });
    sync();
    syncScroll();
    requestAnimationFrame(syncScroll);
    if (focusId != null) {
      const t = tasks.find((x) => x.id === focusId);
      if (t) { t.ta.focus(); bodyEl.scrollTop = bodyEl.scrollHeight; }
    }
  }

  function sync() {
    const n = tasks.length;
    pop.classList.toggle("multi", n > 1);
    countEl.textContent = n > 1 ? `· ${n} chained` : "";
    submitLbl.textContent = n > 1 ? `Submit ${n}` : "Submit";

    tasks.forEach((t, i) => {
      t.el.classList.toggle("sel", t.id === sel);
      t.el.querySelector(".num").textContent = i + 1;
      t.el.querySelector(".chain").textContent = i === 0 ? "" : `runs after ${i}`;
      t.el.querySelector(".kill").style.display = n === 1 ? "none" : "";
    });

    const cur = tasks.find((t) => t.id === sel) || tasks[0];
    const i = tasks.indexOf(cur);
    discLabel.textContent = n > 1 ? `How task ${i + 1} runs` : "How it runs";
    discSum.innerHTML = `<b>${cur.model}</b> · ${cur.thinking.toLowerCase()} thinking`;
    document.querySelector('[data-value="model"]').textContent = cur.model;
    document.querySelector('[data-value="preprompt"]').textContent = cur.preprompt;
    document.querySelectorAll("#seg button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.textContent === cur.thinking))
    );
    applyAll.classList.remove("done");
    applyAll.querySelector("span").textContent = "Use for every task";
  }

  function select(id) {
    if (sel === id) return;
    sel = id;
    closeMenu();
    sync();
  }

  function addTask() {
    const t = makeTask("", false);
    tasks.push(t);
    sel = t.id;
    rebuild(t.id);
  }

  function removeTask(id) {
    const i = tasks.findIndex((t) => t.id === id);
    if (i < 0 || tasks.length === 1) return;
    tasks.splice(i, 1);
    if (sel === id) sel = tasks[Math.max(0, i - 1)].id;
    rebuild(null);
  }

  // ---------------------------------------------------------------- disclosure
  const disc = document.getElementById("disc");
  const discBtn = document.getElementById("discBtn");
  discBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = disc.getAttribute("open-state") === "1";
    disc.setAttribute("open-state", open ? "0" : "1");
    discBtn.setAttribute("aria-expanded", String(!open));
    closeMenu();
  });

  document.getElementById("seg").addEventListener("click", (e) => {
    e.stopPropagation();
    const b = e.target.closest("button");
    if (!b) return;
    tasks.find((t) => t.id === sel).thinking = b.textContent;
    sync();
  });

  applyAll.addEventListener("click", (e) => {
    e.stopPropagation();
    const cur = tasks.find((t) => t.id === sel);
    tasks.forEach((t) => { t.model = cur.model; t.preprompt = cur.preprompt; t.thinking = cur.thinking; });
    applyAll.classList.add("done");
    applyAll.querySelector("span").textContent = `Applied to all ${tasks.length}`;
  });

  // ---------------------------------------------------------------- menu
  let menuEl = null;
  function closeMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
    document.querySelectorAll('.select[aria-expanded="true"]').forEach((b) => b.setAttribute("aria-expanded", "false"));
  }

  document.querySelectorAll(".select[data-menu]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const kind = btn.dataset.menu;
      const items = kind === "model" ? MODELS : PREPROMPTS;
      const cur = tasks.find((t) => t.id === sel);
      const wasOpen = btn.getAttribute("aria-expanded") === "true";
      closeMenu();
      if (wasOpen) return;

      btn.setAttribute("aria-expanded", "true");
      menuEl = document.createElement("div");
      menuEl.className = "menu";
      menuEl.setAttribute("role", "menu");
      items.forEach((item) => {
        const b = document.createElement("button");
        b.className = "menu-item";
        b.setAttribute("role", "menuitemradio");
        b.setAttribute("aria-checked", String(item === cur[kind]));
        b.innerHTML = `<span>${item}</span>${tick}`;
        b.addEventListener("click", (ev) => { ev.stopPropagation(); cur[kind] = item; closeMenu(); sync(); });
        menuEl.appendChild(b);
      });

      disc.appendChild(menuEl);
      const a = btn.getBoundingClientRect();
      const r = disc.getBoundingClientRect();
      menuEl.style.left = a.left - r.left + "px";
      menuEl.style.top = a.bottom - r.top + 4 + "px";
    });
  });

  function syncScroll() {
    bodyEl.classList.toggle("scrolled", bodyEl.scrollTop > 2);
  }
  bodyEl.addEventListener("scroll", syncScroll);

  document.addEventListener("click", closeMenu);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); submit(); }
  });

  // ---------------------------------------------------------------- submit
  const filed = document.getElementById("filed");
  const filedText = document.getElementById("filedText");
  let filedTimer;

  function submit() {
    const n = tasks.length;
    filedText.innerHTML =
      n === 1
        ? `Filed <b>1 task</b> — starting on <b>${tasks[0].model}</b>`
        : `Filed <b>${n} chained tasks</b> — ${tasks.map((t, i) => `${i + 1}·${t.model}`).join(" → ")}`;
    filed.classList.add("show");
    clearTimeout(filedTimer);
    filedTimer = setTimeout(() => filed.classList.remove("show"), 2600);
  }
  document.getElementById("submit").addEventListener("click", (e) => { e.stopPropagation(); submit(); });
  document.getElementById("addTask").addEventListener("click", (e) => { e.stopPropagation(); addTask(); });

  // ---------------------------------------------------------------- boot
  tasks.push(makeTask("Row hover states linger after the pointer leaves — clicking a row pins its actions open until you click another one.", true));
  sel = tasks[0].id;
  rebuild(null);
</script>
</body>
</html>
